<a class="card" [routerLink]="['/pelicula', movie().id]">
  <div class="poster">
    <img [src]="movie().poster" [alt]="movie().title" />
    <app-rating-badge class="rating" [rating]="movie().rating" />
  </div>
  <div class="info">
    <h3>{{ movie().title }}</h3>
    <span>{{ movie().year }}</span>
  </div>
</a>
